# Render blueprint: one free web service and one free PostgreSQL database.
# Dashboard → New → Blueprint → pick this repository. (Vercel + Neon instructions are in docs/DEPLOYMENT.md.)
services:
  - type: web
    name: lifeos
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npx next start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-db
          property: connectionString
databases:
  - name: lifeos-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
